[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_backend"

[project]
name = "kalshibot"
version = "0.2.0"
description = "Hourly BTC/ETH Kalshi threshold scanner."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic-settings>=2.4.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
kalshibot = "src.main:cli"
kb = "src.main:cli"
kb15 = "src.fifteen.main:cli"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
