<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KalshiBot · Live</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="nav">
      <div class="nav-left">
        <a class="brand" href="/" aria-label="KalshiBot home">
          <span class="mark" aria-hidden="true">K</span>
          <span class="word">Kalshi<span>Bot</span></span>
        </a>
        <nav class="nav-links" aria-label="Primary">
          <button class="nav-link active" data-view="markets" type="button">Markets</button>
          <button class="nav-link" data-view="portfolio" type="button">Portfolio</button>
        </nav>
      </div>
      <div class="nav-right">
        <div class="nav-clock" id="clock">—</div>
        <div class="live-pill dry" id="live-pill">DRY</div>
        <div class="nav-cash" id="nav-cash">$—</div>
        <button class="ghost" id="refresh" type="button">Refresh</button>
      </div>
    </header>

    <main class="page">
      <section class="portfolio-bar" id="campaign" aria-label="Campaign book">
        <div class="folio-stats">
          <div class="folio">
            <span class="label">Cash</span>
            <span class="num" id="folio-cash">—</span>
          </div>
          <div class="folio">
            <span class="label">Portfolio</span>
            <span class="num" id="folio-equity">—</span>
          </div>
          <div class="folio">
            <span class="label">P&amp;L</span>
            <span class="num" id="folio-pnl">—</span>
          </div>
          <div class="folio">
            <span class="label">Buying power</span>
            <span class="num" id="folio-room">—</span>
          </div>
          <div class="folio">
            <span class="label">Per idea</span>
            <span class="num" id="folio-idea">—</span>
          </div>
        </div>
        <div class="folio-actions">
          <div class="chips" id="status-chips"></div>
          <div class="trade-actions">
            <button type="button" class="btn" data-fire="fifteen">Fire 15m</button>
            <button type="button" class="btn" data-fire="hourly">Fire hourly</button>
            <button type="button" class="btn" data-fire="maker">Fire maker</button>
            <button type="button" class="btn btn-halt" id="halt-btn">Halt</button>
          </div>
        </div>
      </section>

      <section class="markets-view" id="view-markets">
        <div class="cat-row">
          <nav class="cats" aria-label="Market categories">
            <button class="cat active" data-section="crypto" type="button">
              Crypto <span class="cat-count" id="stat-crypto"></span>
            </button>
            <button class="cat" data-section="commodities" type="button">
              Commodities <span class="cat-count" id="stat-commodities"></span>
            </button>
            <button class="cat" data-section="sports" type="button">
              Sports <span class="cat-count" id="stat-sports"></span>
            </button>
          </nav>
          <div class="toolbar">
            <label class="search">
              <input id="filter" type="search" placeholder="Search markets, tickers, BTC…" />
            </label>
            <label class="toggle">
              <input id="edges-only" type="checkbox" />
              Edges ≥ 2¢
            </label>
          </div>
        </div>
        <p class="disclaimer" id="disclaimer"></p>
        <section id="board" class="board" aria-live="polite"></section>
      </section>

      <section class="portfolio-view hidden" id="view-portfolio">
        <div class="blotter-head">
          <h2>Portfolio</h2>
          <p class="muted" id="book-meta">One book · size follows Kalshi cash unless you set a cap</p>
        </div>
        <div class="blotter-tabs" role="tablist">
          <button class="blot-tab active" data-blot="positions" type="button">Positions</button>
          <button class="blot-tab" data-blot="orders" type="button">Orders</button>
          <button class="blot-tab" data-blot="activity" type="button">Activity</button>
        </div>
        <div id="blotter" class="blotter"></div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
